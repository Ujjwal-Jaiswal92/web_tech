<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            display: block;
        }
        h1{
            display: inline;
        }
        .a{
            width: 100px;
            height: 100px;
            background-color: rgb(178, 35, 92);
            /* float: right; */
        }
        .b{
            width: 100px;
            height: 100px;
            background-color: rgb(178, 35, 92);
            /* float: right; */
        }
        .inline{
            width: 100px;
            height: 100px;
            background-color: blue;
            position: relative;
            display: inline-block;
        }
        span{
            width: 100px;
            height: 100px;
            background-color: rgb(104, 173, 48);
            position: relative;
            display: inline-block;
        }
        p{
            display: inline;
        }

    </style>
</head>
<body>
    <a href="#">hello</a>
    <a href="#">hye</a>
    <h1>
        head1
    </h1>
    <h1>head 2</h1><br>
    <div class="inline">div
    </div>
    <span>span</span>
    <P>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laboriosam, assumenda ab exercitationem ipsum expedita hic et modi, tempora nemo quae soluta perspiciatis iusto adipisci enim eos vero. Accusantium, aut ut!</P>

    <div class="a">div 1</div>
    <div class="b">div 2</div>
</body>
</html>
