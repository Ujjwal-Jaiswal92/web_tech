<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0%;
            height: 2000px;
        }
        .a{
            width: 100%;
            height: 50px;
            background-color: rgb(224, 8, 8);
            position: sticky;
            top:0px;
        }
        .b{
            width: 100px;
            height: 100px;
            background-color: rgb(231, 247, 5);
            position:static;
            right: 0px;
            bottom: 0px;
        
        }
         .c{
            width: 100px;
            height: 100px;
            background-color: rgb(91, 94, 47);
            position: relative;
            left: 400px;
         }
         .d{
            width: 100px;
            height: 100px;
            background-color: rgb(195, 103, 37);
            position: absolute;
         }
         .e{
            width: 100px;
            height: 100px;
            background-color: rgb(102, 35, 130);
            position: fixed;
            
         }

    </style>
</head>
<body>
    
        <div class="a">div 1</div><br>
        <div class="b">div 2</div>
        <div class="c">div 3</div>
        <div class="d">div 4</div>
        <div class="e">div 5</div>
</body>
</html>
