<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Layout</title>
<script src="https://kit.fontawesome.com/11b443e7bd.js" crossorigin="anonymous"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.main{
    width:100%;
    height:100vh;
    background-color:rgb(239,239,236);
    position:relative;
}

.left-corn{
    width:200px;
    height:200px;
    background-color:blue;
    position:absolute;
    top:0;
    left:0;
}


.right-corn{
    width:200px;
    height:200px;
    background-color:blue;
    position:absolute;
    bottom:0;
    right:0;
}


.profile{
    width:80%;
    height:650px;
    background-color:rgb(229, 234, 234);

    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);

    z-index:1;

    display:flex;
    border-radius: 7px;
}


.profile-left{
    width:40%;
}

.profile-right{
    width:50%;
    display: flex;
}
.profile-left-top
{
    background-color: white;
    border-radius: 10px;
    text-align: center;
    height: 350px;
}
.profile-left-top img
{
    height: 150px;
    width: 150px;
    border-radius: 50%;
    
    margin-top: 20px;
    
}
.profile-left-top h3
{
    margin-top: 8px;
    color: rgb(5, 54, 107);
}
.profile-left-top p
{
    color: #6e6c6c;
}
.left-button
{
   padding-top: 20px;
   padding-bottom: 50px;
}
.follow
{
    color: white;
    background-color: rgb(5, 54, 107);
    padding: 10px;
    width:180px;
    border-radius: 20px;
    cursor: pointer;
}
.message
{
    color: rgb(5, 54, 107);
    background-color: white;
    padding: 10px;
    width:180px;
    border-radius: 20px;
    border-color:gray ;
    cursor: pointer;
}
.profile-left-bottom
{
    background-color: white;
    border-radius: 10px;
    text-align: center;
    margin-top: 15px;
    height: 150px;
}

.profile-left-bottom ul li
{
    list-style-type:none ;
    text-align: left;
    padding-left: 20px;
}

.profile-left-bottom .fa-brands
{
    padding-top: 15px;
}

.profile-left-bottom span
{
    padding-left:10px;
}
.profile-left-bottom .social-link
{
    padding-left: 260px;
    color: #b8b6b6;
    text-decoration: none;
}

</style>
</head>
<body>

<div class="main">

    <div class="left-corn"></div>

    <div class="right-corn"></div>

    <div class="profile">
        <div class="profile-left">
            <div class="profile-left-top">
                <img src="hero.jpg" alt="">
                <h3>Ujjwal Jaiswal</h3>
                <p>Engineering Student</p>
                <p>Hunger to Code</p>
                <div class="left-button">
                    <button class="follow">Follow</button>
                    <button class="message">Message</button>
                </div>
            </div>
            <div class="profile-left-bottom">
                <ul>
                    <li><i class="fa-brands fa-linkedin"></i><span>Linkedin</span>
                        <a href="#" class="social-link">Linkedin</a>
                    </li>
                    <li><i class="fa-brands fa-facebook"></i><span>Facebook</span>
                        <a href="#" class="social-link">Facebook</a>
                    </li>
                    <li><i class="fa-brands fa-instagram"></i><span>Instagram</span>
                        <a href="#" class="social-link">Instagram</a>
                    </li>
                    <li><i class="fa-brands fa-facebook-messenger"></i><span>Messenger</span>
                        <a href="#" class="social-link">Messenger</a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="profile-right">
            <div class="profile-right-left">
                <p>Full Name <span>Ujjwal Jaiswal</span></p>
                <p>Email <span>ujjwal.241527@ncit.edu.np</span></p>
                <p>Phone <span>9800000000</span></p>
                <p>Mobile <span>981111111</span></p>
                <p>Address <span>Koteshwor, Kathmandu</span></p>
            </div>
            <div class="profile-right-right">

            </div>
        </div>
    </div>

</div>

</body>
</html>
