<!DOCTYPE html>
<html>
<head>
    <title>Phrase tags</title>
    <meta charset="UTF-8">
</head>
<body>
<p>This is <em>important</em> text</p>
<p>This is <strong>very important</strong></p>
<p>I read <cite>Rich Dad Poor Dad</cite></p>
<p><dfn>HTML</dfn> is a markup language</p>
<p><abbr title="HyperText Markup Language">HTML</abbr></p>
<p>Use <code>print()</code> function</p>
<p><var>x</var> = 10</p>
<p>Press <kbd>Ctrl</kbd> + <kbd>C</kbd></p>
<p>Output: <samp>Hello World</samp></p>


</body>
</html>
