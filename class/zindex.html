<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            height: 100px;
            width: 100px;
            background-color: aquamarine;
            position: relative;
            top:50px;
            z-index: -1;
        }
        .b{
            height: 100px;
            width: 100px;
            background-color: rgb(255, 170, 51);
        }
        .c{
            height: 100px;
            width: 100px;
            background-color: rgb(50, 7, 243);
            position: absolute;
            top: 20px;
        }
    </style>
</head>
<body>
    <div class="a">div1</div>
    <div class="b">div2</div>
    <div class="c">div3</div>
</body>
</html>
