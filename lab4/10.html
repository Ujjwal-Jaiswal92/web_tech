<!DOCTYPE html>
<html>

<head>
    <title>Question 10</title>
</head>

<body>

    <h3>Example 1: Direction Right</h3>
    <marquee direction="right" scrollamount="10" bgcolor="#eeeeee">
        <b>This text scrolls from left to right.</b>
    </marquee>

    <h3>Example 2: Alternate Bouncing Text</h3>
    <marquee behavior="alternate" scrollamount="15" bgcolor="#dddddd">
        <b>
            <font color="red">This text bounces back and forth.</font>
        </b>
    </marquee>

    <h3>Example 3: Nested Marquees</h3>

    <marquee direction="up" behavior="alternate" height="150" scrollamount="10" bgcolor="#ff0">
        <marquee direction="left" behavior="alternate" scrollamount="10">
            <b>
                <font color="blue">Nested Bounce Effect</font>
            </b>
        </marquee>
    </marquee>


</body>

</html>
