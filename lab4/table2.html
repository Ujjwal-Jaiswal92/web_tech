<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border cellspacing="1" cellpadding="px" style="text-align: center;">

            <td>First sem</td>

                <table border>
                    <caption> <b>Total</b></caption>
                    <tr>
                        <td>Male</td>
