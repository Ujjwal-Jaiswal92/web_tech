<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-size: smaller;
        }


        table {
            text-align: left;
        }

        td {
            width: 50%;
        }

        table td:nth-child(2) input[type="text"],
        table td:nth-child(1) textarea {
            width: 100%;
            border: 2px solid white;
            border-top: 2px solid gray;
            border-left: 2px solid gray;
            box-sizing: border-box;
        }

        select {
            font-family: 'Courier New', Courier, monospace;
            font-size: smaller;
            border: 2px solid white;
            border-top: 2px solid gray;
            border-left: 2px solid gray;
        }

        th {
            text-align: center;
            background-color: #c7c3f3;
        }

        #btn {
            text-align: center;
        }


        button {
            font-family: "Times New Roman", serif;
            padding: 3px 12px;
            background: #e6e6e6;
            border: 2px solid white;
            border-right: 2px solid gray;
            border-bottom: 2px solid gray;
        }
    </style>
</head>

<body>
    <form action="">
        <table border align="center" width="400px">
            <tr>
                <th>Name</th>
                <th>Value</th>
            </tr>
            <tr>
                <td>Name</td>
                <td><label><input type="text"></label></td>
            </tr>
            <tr>
                <td>Sex</td>
                <td>
                    <input type="radio" name="sex">Male <br>
                    <input type="radio" name="sex">Female

                </td>
            </tr>
            <tr>
                <td>Eye Color</td>
                <td>
                    <select name="" id="">
                        <option value="">Black</option>
                        <option value="">Green</option>
                        <option value="">Blue</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Check all that apply</td>
                <td>
                    <input type="checkbox" name="" id="">Over 6 feet tall <br>
                    <input type="checkbox" name="" id="">Over 200 pounds
                </td>
            </tr>
            <tr>
                <td colspan="2">Desccribe your atheletic abilities:</td>
            </tr>
            <tr>
                <td colspan="2">
                    <textarea name="" id=""></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" id="btn">
                    <Button>Enter my information</Button>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
