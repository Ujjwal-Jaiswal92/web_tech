<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
    body{
        background:#e5e5e5;
        font-family: Georgia, serif;
    }

    .container{
        width:700px;
        margin:60px auto;
        background:#f1d9d8;
        padding:40px;
    }

    h1{
        text-align:center;
        font-size:50px;
        margin-bottom:40px;
    }

    table{
        width:100%;
        border-spacing:15px;
    }

    td{
        font-size:20px;
        vertical-align:middle;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="number"],
    textarea,
    select{
        padding:8px;
        border:1px solid #aaa;
    }

    .full{
        width:350px;
    }

    textarea{
        width:340px;
        height:80px;
        resize:none;
    }

    .btn{
        text-align:center;
    }

    button{
        padding:5px 15px;
        font-size:16px;
    }
    
</style>
</head>

<body>

<div class="container">

<h1>Student Registration Form</h1>

<form>

<table>

<tr>
    <td>Roll no. :</td>
    <td><input type="number" class="full"></td>
</tr>

<tr>
    <td>Student name :</td>
    <td>
        <input type="text" placeholder="First Name">
        -
        <input type="text" placeholder="Last Name">
    </td>
</tr>

<tr>
    <td>Father's name :</td>
    <td><input type="text" class="full"></td>
</tr>

<tr>
    <td>Date of birth :</td>
    <td>
        <input type="text" placeholder="Day" size="4">
        -
        <input type="text" placeholder="Month" size="5">
        -
        <input type="text" placeholder="Year" size="8">
        <i>(DD-MM-YYYY)</i>
    </td>
</tr>

<tr>
    <td>Mobile no. :</td>
    <td>
        <input type="text" value="+91" size="4">
        -
        <input type="text" class="full">
    </td>
</tr>

<tr>
    <td>Email id :</td>
    <td><input type="email" class="full"></td>
</tr>

<tr>
    <td>Password :</td>
    <td><input type="password" class="full"></td>
</tr>

<tr>
    <td>Gender :</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>

<tr>
    <td>Department :</td>
    <td>
        <input type="checkbox"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech
    </td>
</tr>

<tr>
    <td>Course :</td>
    <td>
        <select style="width:400px;">
            <option selected disabled hidden>------------------ Select Current Course's ------------------</option>
            <option>BCA</option>
            <option>BSc CSIT</option>
            <option>BEIT</option>
            <option>BIM</option>
            <option>BBA</option>
        </select>
    </td>
</tr>

<tr>
    <td>Student photo :</td>
    <td><input type="file"></td>
</tr>

<tr>
    <td>City :</td>
    <td><input type="text" class="full"></td>
</tr>

<tr>
    <td>Address :</td>
    <td><textarea></textarea></td>
</tr>

<tr>
    <td colspan="2" class="btn">
        <button type="submit">Register</button>
    </td>
</tr>

</table>

</form>

</div>

</body>
</html>
