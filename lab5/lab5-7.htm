<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1. Color Name -->
<p style="color:red;">This text is Red (Color Name)</p>

<!-- 2. Hex Code -->
<p style="color:#0000FF;">This text is Blue (Hex Code)</p>

<!-- 3. RGB -->
<p style="color:rgb(0,128,0);">This text is Green (RGB)</p>

<!-- 4. RGBA -->
<p style="color:rgba(255,0,0,0.5);">This text is Semi-Transparent Red (RGBA)</p>

<!-- 5. HSL -->
<p style="color:hsl(240,100%,50%);">This text is Blue (HSL)</p>
</body>
</html>
