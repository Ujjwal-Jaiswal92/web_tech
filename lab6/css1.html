<!DOCTYPE html>
<html>

<head>
    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="css1.css">
</head>

<body>

    <h1 style="color:red; text-align:center;">
        This is Inline CSS
    </h1>

    <h2>
        This is Internal CSS
    </h2>

    <p>
        This paragraph is styled using External CSS.
    </p>

</body>

</html>
