<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-size: 40px;
            font-family: 'Courier New', Courier, monospace;
            color: rgb(58, 236, 22);
            background-color: black;
        }

        p {
            font-size: 30px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: rgb(214, 18, 64);
            
        }

        .class_selector {
            font-size: 30px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: rgb(38, 35, 210);
        }

        #idselector {
            font-size: 30px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: rgb(173, 9, 113);
        }
    </style>
</head>

<body>
    <h1>Selectors in CSS</h1>
    <div>
        <p>This is Element Selector</p>
    </div>
    <div class="class_selector">
        This is Class Selector
    </div>
    <div id="idselector">
        This is ID Selector
    </div>
</body>

</html>
