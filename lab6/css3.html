<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
        }
        #nav {
            width: 100%;
            background-color: rgb(97, 185, 248);
            font-size: larger;
            display: flex;
            height: 50px;
            align-items: center;
        }

        .nav {
            margin-right: 20px;
        }

        #search {
            margin-left: auto;
            margin-right: 20px;
        }

        #logo {
            height: 30px;
            width: 40px;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTFNXBMgflFqD9wrp7nqnJzzs6pTxBlx4PmCL5GW-H7w&s=10);
            border-radius: 50%;
            background-size: cover;
            background-position: no-repeat;
        }

        .hero-section {
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlIziFLOPbyzwIhjPPnioItURmWxHs_kxzWTNXEfnuJQ&s=10);
            background-repeat: no-repeat;
            background-size: cover;
            height: 50px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div id="nav">
        <div class="nav" id="logo"></div>
        <div class="nav">Home</div>
        <div class="nav">About</div>
        <div class="nav">Contact</div>

        <div id="search">
            <input type="text" placeholder="Search">
        </div>
    </div>
    <div class="hero-section">
       <p>NEPAL COLLEGE OF INFORMATION TECHNOLOGY  <br>
       Balkumar,Lalitpur
    </div>
</body>

</html>
