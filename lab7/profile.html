<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-content: center;
        }
        .container
        {
            height: 300px;
            width: 500px;
            margin: 10%;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

            display: flex;
            flex-direction: row;
            justify-content: center;
            align-content: center;

            border-radius: 8px;
            background-color: rgb(230, 228, 228);
        }

        .left
        {
            flex: 1.2;
            background-color: rgb(86, 133, 86);

            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 5px;
            
        }

        .profile-pic
        {
            height: auto;
            
            content: cover;
           box-shadow: 0px 10px 10px;
            
        }

       img
        {
            border-radius: 20px;
            padding: 8px;
            height: 190px;
            width: 170px;
            border-radius: 2px solid rgb(219, 73, 73);
            
        }

        .detail
        {
            text-align: center;
            color: white;
            
        }

        .detail h2
        {
            font-size: 15px;
            margin-bottom: 5px;
            
        }

        .detail h3
        {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail h4
        {
            font-size: 8px;
        }

        .right
        {
            flex: 2.2;
            
            display: flex;
            flex-direction: column;
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="profile-pic">
                <img src="hero.jpg" alt="">
            </div>
            <div class="detail">
                <h2>Ujawal Jaiswal</h3>
                <h3>IT Engineering Student</h2>
                <h4>NCIT College, Lalitpur</h4>
            </div>
        </div>
        <div class="right">
            <div class="info">
                <h2>Information</h2>
                <div class="label">
                    <p>Email:</p>
                    <p>Phone:</p>
                </div>
                <div class="field">
                    <p>ujawal.241527@ncit.edu.np</p>
                    <p>+977-9800000000</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
